version: "3.8"

# SECURITY FIXES applied to the original docker-compose.yml in this folder:
#  1. The Postgres service used hardcoded credentials (postgres/postgres) directly
#     in this file instead of variables, and published port 5432 straight to the
#     host network as 5434 with restart:always. Anyone who could reach this
#     machine on the network could connect as postgres/postgres and read or
#     write every table. Fixed: credentials now come from a local .env file
#     (create one next to this compose file, add .env to .gitignore, never
#     commit or store the .env itself in Drive), and the port is bound to
#     127.0.0.1 only so it's reachable from this machine for admin tools but
#     not from the network.
#  2. GeoServer's CORS_ALLOWED_ORIGINS was "*" (wildcard) — any website could
#     make authenticated cross-origin requests against it. Fixed: set it to
#     the actual frontend origin via an env var (defaults to localhost dev).
#
# Create a .env file next to this compose file with:
#   POSTGRES_USER=choose_a_user
#   POSTGRES_PASSWORD=choose_a_strong_password
#   POSTGRES_DB=choose_a_db_name
#   GEOSERVER_CORS_ORIGIN=https://networkengineringmowt-ai.github.io

services:
  # Tier 3 - Spatial Services (ArcGIS GIS Server Equivalent)
  # GeoServer provides OGC compliant web services (WMS, WFS, WCS, WMTS)
  geoserver:
    image: docker.osgeo.org/geoserver:2.24.2
    container_name: nrms_geoserver
    env_file:
      - .env
    ports:
      - "8081:8080"
    environment:
      # Pass custom JVM options for better performance (mimicking ArcGIS Server SOC tuning)
      - INITIAL_MEMORY=2G
      - MAXIMUM_MEMORY=4G
      # Path where GeoServer will look for its configuration and data
      - GEOSERVER_DATA_DIR=/opt/geoserver_data
      # Setup CORS to allow only the real frontend to consume WFS/WMS
      - CORS_ENABLED=true
      - CORS_ALLOWED_ORIGINS=${GEOSERVER_CORS_ORIGIN:-http://localhost:5173}
      - CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,HEAD,OPTIONS
      - CORS_ALLOWED_HEADERS=*
    volumes:
      # Map the local Google Drive folder to the container's data directory.
      # This ensures all layer configs, workspaces, and styling (SLDs) are
      # automatically synced to the cloud and persisted.
      - "g:/My Drive/MOWT/Uganda National Road Network Repository/geoserver_data:/opt/geoserver_data"
    restart: unless-stopped

  # Optional local PostGIS database for testing before deploying to Supabase
  # Tier 4 - Data Layer
  db:
    image: postgis/postgis:15-3.3
    container_name: nrms_postgis
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to localhost only — this is a local test database, not meant
      # to be reachable from the network. Previously published as "5434:5432"
      # (all interfaces) with hardcoded postgres/postgres credentials.
      - "127.0.0.1:5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data:
